<!DOCTYPE html>

<html lang="es">

<head>

<meta charset="UTF-8">

<title>Manifiesto RPBI Ecológico</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light p-4">

<div class="container">

<h2 class="text-success border-bottom pb-2"> Control de Residuos Biológico Infecciosos</h2>


<!-- Tarjetas de resumen -->

<div class="row mb-4 text-center">

<div class="col-md-6">

<div class="p-3 bg-danger text-white rounded shadow-sm">

Total Punzocortantes: <span id="totPunzo" class="fs-4 fw-bold">0</span> kg

</div>

</div>

<div class="col-md-6">

<div class="p-3 bg-warning text-dark rounded shadow-sm">

Total Patológicos: <span id="totPato" class="fs-4 fw-bold">0</span> kg

</div>

</div>

</div>


<div class="row">

<div class="col-md-4">

<div class="card p-3 shadow-sm">

<input type="text" id="areaHosp" class="form-control mb-2" placeholder="Área (Ej. Quirófano 1)">

<select id="tipoRPBI" class="form-select mb-2">

<option value="punzocortante">Punzocortante (Rojo)</option>

<option value="patologico">Patológico (Amarillo)</option>

</select>

<input type="number" step="0.1" id="pesoKg" class="form-control mb-3" placeholder="Peso en Kg">

<button id="btnAgregarResiduo" class="btn btn-success w-100">Registrar Bolsa/Recipiente</button>

</div>

</div>

<div class="col-md-8">

<ul id="listaResiduos" class="list-group shadow-sm">

<!-- Lista de residuos inyectados con JS -->

</ul>

</div>

</div>

</div>

<script src="js/rs.js"></script>

</body>

</html>
